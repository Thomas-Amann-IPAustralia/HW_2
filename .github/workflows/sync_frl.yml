name: Sync FRL Documents

on:
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 0 * * *' # Optional: runs daily at midnight

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Run Fetch Script
        run: python fetch_frl_data.py

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Legislation Data and Text Snapshots"
          # Target the JSON file AND the new directory
          file_pattern: 'legislation_data.json legislative_text/*'
          # If the file hasn't changed, don't error out
          skip_dirty_check: false
          fail_on_empty: false
