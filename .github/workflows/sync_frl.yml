name: Sync FRL Documents

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Run Fetch Script
        # Make sure this matches your actual python filename
        run: python fetch_frl_data.py

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Legislation Data and Text"
          # IMPORTANT: Add the new directory to the file pattern
          file_pattern: 'legislation_data.json legislative_text/*'
          skip_dirty_check: false
          fail_on_empty: false
