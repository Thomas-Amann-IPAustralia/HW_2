name: Sync FRL Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests urllib3

    - name: Run Fetch Script
      run: python fetch_frl_data.py

    - name: Commit Results
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated FRL Update: Trade Marks & Patents"
        file_pattern: 'legislation_data.json'
        
    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "FRL Data Sync: C2024C00545"
        # Using a more flexible pattern and disabling failure if empty
        file_pattern: 'legislation_metadata.json *.pdf *.docx *.txt'
        disable_globbing: false
        skip_dirty_check: false
