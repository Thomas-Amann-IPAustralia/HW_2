name: Update Trade Marks Act snapshot

on:
  workflow_dispatch:
  schedule:
    # GitHub cron runs in UTC. This is weekly at 15:00 UTC on Sunday.
    # (Adjust if you want a specific AU time.)
    - cron: "0 15 * * 0"

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run downloader
        run: |
          python runner.py

      - name: Commit and push if changed
        run: |
          set -e

          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add Trade_Marks_Act_latest.xml
            git commit -m "Update Trade Marks Act snapshot (latest compilation)"
            git push
          else
            echo "No changes detected; nothing to commit."
          fi
